name: Release

# ISAP-01 — PyPI / TestPyPI publish infrastructure.
#
# Publishes only from explicit release events:
#
#   1. Manual dispatch from reviewed `main`: publish the final version to
#      TestPyPI.
#   2. Pre-release tags (`v*alpha*`, `v*beta*`, `v*rc*`): publish to TestPyPI.
#   3. Final release tags (`v*` not matching a pre-release pattern): publish to
#      PyPI through the `pypi` GitHub environment.
#
# Normal PR and branch validation belongs to the required CI workflows. Keeping
# it out of this workflow avoids repeating the full release suite on promotion
# and runtime-metadata changes that do not publish package artifacts.
#
# Trusted Publishing (OIDC) is preferred over long-lived API tokens; the
# `id-token: write` permission below enables it. To switch backends, swap
# the `gh-action-pypi-publish` invocation's password input for a token-based
# variant.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Package index target"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-release-request:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.route.outputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install release routing dependency
        run: python -m pip install 'packaging==26.0'
      - name: Validate release event and target
        id: route
        run: >-
          python -m scripts.ci.release_event
          --event-name "${{ github.event_name }}"
          --ref "${{ github.ref }}"
          --requested-target "${{ github.event.inputs.target }}"
          --github-output "$GITHUB_OUTPUT"

  release-prerequisites:
    needs: validate-release-request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Prepare isolated runtime roots
        run: |
          {
            echo "OPENMINION_HOME=$RUNNER_TEMP/openminion-home"
            echo "OPENMINION_DATA_ROOT=$RUNNER_TEMP/openminion-data"
            echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/openminion-pycache"
          } >> "$GITHUB_ENV"
          mkdir -p \
            "$RUNNER_TEMP/openminion-home" \
            "$RUNNER_TEMP/openminion-data" \
            "$RUNNER_TEMP/openminion-pycache"
      - name: Prepare lint workspace
        run: |
          mkdir -p .deps
          git clone --depth 1 https://github.com/openminion/openminion-eval .deps/openminion-eval
      - name: Bootstrap repo venv
        run: |
          python -m venv .venv
          .venv/bin/python3.11 -m pip install --upgrade pip setuptools wheel
          .venv/bin/python3.11 -m pip install -e ".[dev]"
      - name: Run release prerequisites
        run: |
          make workflow-check
          make format-check
          make lint
          make test-ci

  build:
    needs: release-prerequisites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Upgrade build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build sdist + wheel
        run: python -m build
      - name: Validate metadata with twine
        run: python -m twine check dist/*
      - name: Upload built artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  verify-built-artifacts:
    needs: build
    name: Verify ${{ matrix.artifact }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        artifact: [wheel, sdist]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify ${{ matrix.artifact }} install and bootstrap smoke
        shell: bash
        env:
          ARTIFACT_KIND: ${{ matrix.artifact }}
        run: |
          venv=".venv-$ARTIFACT_KIND"
          python -m venv "$venv"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python_bin="$venv/Scripts/python.exe"
          else
            python_bin="$venv/bin/python"
          fi
          "$python_bin" -m pip install --upgrade pip

          shopt -s nullglob
          if [[ "$ARTIFACT_KIND" == "wheel" ]]; then
            artifacts=(dist/openminion-*.whl)
          else
            artifacts=(dist/openminion-*.tar.gz)
          fi
          if [[ ${#artifacts[@]} -ne 1 ]]; then
            echo "expected one $ARTIFACT_KIND artifact, found ${#artifacts[@]}" >&2
            exit 1
          fi
          "$python_bin" -m pip install "${artifacts[0]}"
          "$python_bin" -m pip check

          expected_version="$(python - <<'PY'
          import runpy

          print(runpy.run_path("src/openminion/base/version.py")["OPENMINION_VERSION"])
          PY
          )"
          actual_version="$("$python_bin" -m openminion --version)"
          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "installed version $actual_version does not match $expected_version" >&2
            exit 1
          fi

          tmpdir="$(mktemp -d)"
          config="$tmpdir/config.json"
          export OPENMINION_HOME="$tmpdir/home-$ARTIFACT_KIND"
          export OPENMINION_DATA_ROOT="$OPENMINION_HOME/.openminion"
          mkdir -p "$OPENMINION_HOME"
          "$python_bin" -m openminion --help >/dev/null
          "$python_bin" - <<'PY'
          import openminion
          from openminion import APIRuntime, Agent, OpenMinionConfig, tool
          from openminion.api import dispatch_request

          print(openminion.__version__)
          print(
              APIRuntime.__name__,
              Agent.__name__,
              OpenMinionConfig.__name__,
              callable(tool),
              callable(dispatch_request),
          )
          PY
          "$python_bin" -m openminion --config "$config" config init --provider echo --force
          "$python_bin" -m openminion --config "$config" verify smoke
          "$python_bin" -m openminion --config "$config" doctor --json
          "$python_bin" -m openminion --config "$config" agent --message "hello"
          first_run="$("$python_bin" -m openminion --config "$config" run --session release-smoke "hello" 2>&1)"
          second_run="$("$python_bin" -m openminion --config "$config" run --session release-smoke --resume "hello again" 2>&1)"
          case "$first_run$second_run" in
            *" INFO "*) echo "public run output exposed internal INFO logs" >&2; exit 1 ;;
          esac
          readiness="$("$python_bin" -m openminion --config "$config" status readiness --json)"
          READINESS="$readiness" "$python_bin" - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["READINESS"])
          checks = {item["id"]: item for item in payload["checks"]}
          assert payload["overall"] == "demo", payload
          assert checks["provider"]["status"] == "demo", payload
          PY
          blocked_config="$tmpdir/blocked-provider.json"
          "$python_bin" -m openminion --config "$blocked_config" config init --provider openai --force
          blocked="$("$python_bin" -m openminion --config "$blocked_config" status readiness --json)"
          BLOCKED="$blocked" "$python_bin" - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["BLOCKED"])
          checks = {item["id"]: item for item in payload["checks"]}
          assert payload["overall"] == "blocked", payload
          assert checks["provider"]["status"] == "blocked", payload
          assert checks["provider"]["safe_next_action"] == "openminion setup", payload
          PY

          if [[ "$ARTIFACT_KIND" == "wheel" && "$RUNNER_OS" == "Linux" ]]; then
            "$python_bin" -m pip install pytest pytest-timeout pyte
            OPENMINION_ONBOARDING_INSTALLED_ARTIFACT=1 \
            OPENMINION_PYTHON="$python_bin" \
            "$python_bin" -m pytest -q \
              tests/e2e/cli/focus/test_onboarding.py \
              -k test_local_ollama_check_can_verify_against_fixture_server
          fi
          "$python_bin" -m openminion --config "$config" daemon stop

  publish-testpypi:
    name: Publish to TestPyPI (reviewed main or pre-release tags)
    needs: [validate-release-request, build, verify-built-artifacts]
    runs-on: ubuntu-latest
    if: needs.validate-release-request.outputs.target == 'testpypi'
    environment:
      name: testpypi
      url: https://test.pypi.org/project/openminion/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI (final release tags, gated)
    needs: [validate-release-request, build, verify-built-artifacts]
    runs-on: ubuntu-latest
    if: needs.validate-release-request.outputs.target == 'pypi'
    environment:
      name: pypi
      url: https://pypi.org/project/openminion/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
