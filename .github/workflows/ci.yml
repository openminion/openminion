name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  first-run:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: python -m pip install .

      - name: Exercise clone-to-first-response setup
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              provider_config = root / "minimax.json"
              env = os.environ.copy()
              env["MINIMAX_API_KEY"] = "fixture-minimax-key-not-for-network-use"
              setup = subprocess.run(
                  [
                      sys.executable,
                      "-m",
                      "openminion",
                      "--config",
                      str(provider_config),
                      "setup",
                      "--provider",
                      "minimax",
                      "--model",
                      "MiniMax-M2.7",
                      "--no-focus",
                  ],
                  check=False,
                  capture_output=True,
                  text=True,
                  env=env,
              )
              assert setup.returncode == 0, setup.stdout + setup.stderr
              doctor = subprocess.run(
                  [sys.executable, "-m", "openminion", "--config", str(provider_config), "doctor", "--json"],
                  check=True,
                  capture_output=True,
                  text=True,
                  env=env,
              )

              demo_config = root / "demo.json"
              base = [sys.executable, "-m", "openminion", "--config", str(demo_config)]
              subprocess.run([*base, "config", "init", "--provider", "echo", "--force"], check=True)
              subprocess.run([*base, "verify", "smoke"], check=True)
              subprocess.run([*base, "doctor", "--json"], check=True)
              try:
                  response = subprocess.run(
                      [*base, "run", "--session", "first-run", "hello"],
                      check=True,
                      capture_output=True,
                      text=True,
                  )
              finally:
                  subprocess.run([*base, "daemon", "stop"], check=True)

              config = provider_config.read_text(encoding="utf-8")
              provider = json.loads(config)["providers"]["openai"]
              assert provider["model"] == "MiniMax-M2.7"
              assert provider["api_key"] == ""
              assert "fixture-minimax-key" not in config + setup.stdout + doctor.stdout
              assert "hello" in response.stdout.lower(), response.stdout
              assert " INFO " not in response.stdout, response.stdout
          PY

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Validate introduced commit messages
        # Every dev push is validated when it lands; promotion and its resulting
        # main push must not recheck squash subjects already accepted there.
        if: github.event_name != 'workflow_dispatch' && !(github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'dev') && !(github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$PR_HEAD_SHA" ]]; then
            revision_args=("$PR_BASE_SHA..$PR_HEAD_SHA")
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            revision_args=("$BEFORE_SHA..$GITHUB_SHA")
          else
            refs=()
            while IFS= read -r ref; do
              case "$ref" in
                "refs/remotes/origin/$GITHUB_REF_NAME"|refs/remotes/origin/HEAD) ;;
                *) refs+=("$ref") ;;
              esac
            done < <(git for-each-ref --format='%(refname)' refs/remotes/origin)
            revision_args=("$GITHUB_SHA" --not "${refs[@]}")
          fi
          while IFS= read -r commit; do
            git show -s --format=%B "$commit" > "$RUNNER_TEMP/commit-message"
            echo "Checking commit $commit"
            python scripts/commit_message.py "$RUNNER_TEMP/commit-message"
          done < <(git rev-list --reverse "${revision_args[@]}")

      - name: Prepare isolated runtime roots
        run: |
          {
            echo "OPENMINION_HOME=$RUNNER_TEMP/openminion-home"
            echo "OPENMINION_DATA_ROOT=$RUNNER_TEMP/openminion-data"
            echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/openminion-pycache"
          } >> "$GITHUB_ENV"
          mkdir -p \
            "$RUNNER_TEMP/openminion-home" \
            "$RUNNER_TEMP/openminion-data" \
            "$RUNNER_TEMP/openminion-pycache"

      - name: Prepare lint workspace
        shell: bash
        run: |
          dep_branch="${OPENMINION_CI_DEP_BRANCH:-main}"
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            if [[ "${GITHUB_HEAD_REF:-}" == release/* ]]; then
              dep_branch="${OPENMINION_CI_DEP_BRANCH:-main}"
            else
              dep_branch="${OPENMINION_CI_DEP_BRANCH:-dev}"
            fi
          fi
          mkdir -p .deps
          [[ -d .deps/openminion-eval ]] || git clone --depth 1 --branch "$dep_branch" https://github.com/openminion/openminion-eval .deps/openminion-eval

      - name: Bootstrap repo venv
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python3.11 -m pip install --upgrade pip setuptools wheel
          .venv/bin/python3.11 -m pip install -e ".[dev]"

      - name: Run blocking lint gate
        run: |
          make workflow-check
          make format-check
          make lint

  critical-path:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare isolated runtime roots
        run: |
          {
            echo "OPENMINION_HOME=$RUNNER_TEMP/openminion-home"
            echo "OPENMINION_DATA_ROOT=$RUNNER_TEMP/openminion-data"
            echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/openminion-pycache"
          } >> "$GITHUB_ENV"
          mkdir -p \
            "$RUNNER_TEMP/openminion-home" \
            "$RUNNER_TEMP/openminion-data" \
            "$RUNNER_TEMP/openminion-pycache"

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Bootstrap repo venv
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python3.11 -m pip install --upgrade pip setuptools wheel
          .venv/bin/python3.11 -m pip install -e ".[dev]"

      - name: Run fast critical-path regressions
        run: make test-critical

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare isolated runtime roots
        run: |
          {
            echo "OPENMINION_HOME=$RUNNER_TEMP/openminion-home"
            echo "OPENMINION_DATA_ROOT=$RUNNER_TEMP/openminion-data"
            echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/openminion-pycache"
          } >> "$GITHUB_ENV"
          mkdir -p \
            "$RUNNER_TEMP/openminion-home" \
            "$RUNNER_TEMP/openminion-data" \
            "$RUNNER_TEMP/openminion-pycache"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Bootstrap repo venv (3.11 package suite)
        if: matrix.python-version == '3.11'
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python3.11 -m pip install --upgrade pip setuptools wheel
          .venv/bin/python3.11 -m pip install -e ".[dev,viewer,otel]"

      - name: Report installed SophiaGraph (3.11)
        if: matrix.python-version == '3.11'
        run: |
          .venv/bin/python3.11 - <<'PY'
          import importlib.metadata
          import sophiagraph

          print("sophiagraph", importlib.metadata.version("sophiagraph"))
          print("imported from", sophiagraph.__file__)
          PY

      - name: Install dependencies (3.12 smoke)
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Run public API import smoke (3.11)
        if: matrix.python-version == '3.11'
        shell: bash
        run: |
          PYTHONPATH=src .venv/bin/python3.11 - <<'PY'
          import openminion
          from openminion import APIRuntime, Agent, OpenMinionConfig, tool
          from openminion.api import (
              RuntimeTurnHandle,
              TurnChunk,
              TurnResponse,
              dispatch_request,
          )

          print(openminion.__version__)
          print(
              APIRuntime.__name__,
              Agent.__name__,
              OpenMinionConfig.__name__,
              RuntimeTurnHandle.__name__,
              TurnChunk.__name__,
              TurnResponse.__name__,
              callable(tool),
              callable(dispatch_request),
          )
          PY

      - name: Verify installed wheel SDK and typing (3.11)
        if: matrix.python-version == '3.11'
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/sdk-wheel"
          mkdir -p "$sdk_root/dist" "$sdk_root/consumer"
          .venv/bin/python3.11 -m build --wheel --outdir "$sdk_root/dist"
          python -m venv "$sdk_root/venv"
          "$sdk_root/venv/bin/python" -m pip install \
            "$sdk_root"/dist/openminion-*.whl 'mypy>=1.10,<2'
          cp \
            tests/typing/fixtures/sdk_consumer_valid.py \
            tests/typing/fixtures/sdk_consumer_invalid.py \
            "$sdk_root/consumer/"
          cd "$sdk_root/consumer"
          PYTHONPATH='' "$sdk_root/venv/bin/python" -m mypy --strict \
            sdk_consumer_valid.py
          set +e
          invalid_output="$(PYTHONPATH='' "$sdk_root/venv/bin/python" \
            -m mypy --strict --show-error-codes sdk_consumer_invalid.py 2>&1)"
          invalid_status=$?
          set -e
          test "$invalid_status" -eq 1
          test "$(printf '%s\n' "$invalid_output" | grep -c ': error:')" -eq 1
          printf '%s\n' "$invalid_output" | grep -F \
            'Argument 1 to "run" of "Agent" has incompatible type "int"; expected "str"  [arg-type]'

          config="$sdk_root/config.json"
          export OPENMINION_HOME="$sdk_root/home"
          export OPENMINION_DATA_ROOT="$sdk_root/data"
          PYTHONPATH='' "$sdk_root/venv/bin/python" -m openminion \
            --config "$config" config init --provider echo --force
          PYTHONPATH='' "$sdk_root/venv/bin/python" - "$config" <<'PY'
          import sys
          from pathlib import Path

          import openminion
          from openminion.api import (
              APIRuntime,
              RuntimeTurnHandle,
              TurnChunk,
              TurnResponse,
          )

          assert not Path(openminion.__file__).resolve().is_relative_to(Path.cwd())
          runtime = APIRuntime.from_config_path(sys.argv[1])
          try:
              handle = runtime.submit_turn(
                  payload={"message": "installed wheel", "session_id": "sdk-wheel"}
              )
              assert isinstance(handle, RuntimeTurnHandle)
              assert all(
                  isinstance(chunk, TurnChunk)
                  for chunk in handle.stream(timeout_s=30)
              )
              assert isinstance(handle.result(timeout_s=30), TurnResponse)
          finally:
              runtime.close()
          PY

      - name: Compile examples (3.11)
        if: matrix.python-version == '3.11'
        run: |
          .venv/bin/python3.11 -m compileall examples

      - name: Run package-owned regression suite (3.11)
        if: matrix.python-version == '3.11'
        run: make test-ci

      - name: Run standalone CLI smoke (3.12)
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          config="$tmpdir/config.json"
          export OPENMINION_HOME="$tmpdir/home"
          export OPENMINION_DATA_ROOT="$OPENMINION_HOME/.openminion"
          mkdir -p "$OPENMINION_HOME"
          python -m openminion --help >/dev/null
          python - <<'PY'
          import openminion
          from openminion import APIRuntime, Agent, OpenMinionConfig, tool
          from openminion.api import (
              RuntimeTurnHandle,
              TurnChunk,
              TurnResponse,
              dispatch_request,
          )

          print(openminion.__version__)
          print(
              APIRuntime.__name__,
              Agent.__name__,
              OpenMinionConfig.__name__,
              RuntimeTurnHandle.__name__,
              TurnChunk.__name__,
              TurnResponse.__name__,
              callable(tool),
              callable(dispatch_request),
          )
          PY
          python -m openminion --config "$config" config init --provider echo --force
          python -m openminion --config "$config" verify smoke
          python -m openminion --config "$config" doctor --json
          python -m openminion --config "$config" agent --message "hello"

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Bootstrap browser test environment
        run: |
          python -m venv .venv
          .venv/bin/python3.11 -m pip install --upgrade pip setuptools wheel
          .venv/bin/python3.11 -m pip install -e ".[dev]"
          .venv/bin/python3.11 -m playwright install --with-deps chromium
      - name: Run required canonical Chromium flow
        env:
          OPENMINION_REQUIRE_CHROMIUM: "1"
        run: >-
          .venv/bin/python3.11 -m pytest -q
          tests/browser-playwright/test_e2e_playwright_canonical.py

  focus-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Prepare isolated runtime roots
        run: |
          {
            echo "OPENMINION_HOME=$RUNNER_TEMP/openminion-home"
            echo "OPENMINION_DATA_ROOT=$RUNNER_TEMP/openminion-data"
            echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/openminion-pycache"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/openminion-home" "$RUNNER_TEMP/openminion-data"
      - name: Bootstrap repo venv
        run: |
          python -m venv .venv
          .venv/bin/python3.11 -m pip install --upgrade pip setuptools wheel
          .venv/bin/python3.11 -m pip install -e ".[dev]"
      - name: Run provider-free Focus and harness regressions
        run: make test-e2e-ci

  postgres-memory-retrieval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OPENMINION_TEST_POSTGRES_URL: postgresql+psycopg://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install OpenMinion with PostgreSQL support
        run: python -m pip install -e ".[dev,postgres]"
      - name: Run PostgreSQL memory conformance
        run: |
          python -m pytest -q -m postgres tests/memory/test_memory_postgres_conformance.py
          python -m pytest -q -m postgres tests/memory/test_memory_search_quality.py::test_postgres_lexical_score_contributes_to_semantic_order
