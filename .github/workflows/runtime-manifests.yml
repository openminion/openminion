name: Runtime manifests

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  push:
    branches: [main]
    paths: ['releases/runtime/v1/**']
  workflow_dispatch:
    inputs:
      binary_release_tag:
        description: Immutable openminion/runtime Release tag to publish
        required: false
        type: string
      binary_release_id:
        description: Opaque binary metadata revision identity
        required: false
        type: string

# One writer for both feeds on the same metadata branch. Failed/canceled requests
# are visibly incomplete and require a rerun; this is not a durable queue.
concurrency:
  group: runtime-manifests-publish
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  source:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      !contains(github.event.workflow_run.head_branch, 'alpha') &&
      !contains(github.event.workflow_run.head_branch, 'beta') &&
      !contains(github.event.workflow_run.head_branch, 'rc') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: runtime-publication
    permissions:
      contents: write
      actions: read
      pull-requests: write
    steps:
      # Use the trusted default branch implementation, never producer-supplied code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install release metadata dependency
        run: python -m pip install 'packaging==26.0'
      - name: Verify protected publication and successful production job
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN: ${{ github.event.workflow_run.id }}
          PRODUCER_TAG: ${{ github.event.workflow_run.head_branch }}
          PRODUCER_COMMIT: ${{ github.event.workflow_run.head_sha }}
          PRODUCER_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from scripts.ci.publish_runtime_manifest import verify_producer

          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/openminion/openminion/' + path]))

          environment = api('environments/runtime-publication')
          run = api('actions/runs/' + os.environ['PRODUCER_RUN'])
          jobs = api('actions/runs/' + os.environ['PRODUCER_RUN'] + '/jobs?per_page=100')['jobs']
          tag = os.environ['PRODUCER_TAG']
          verify_producer(environment, run, jobs, api('commits/' + tag)['sha'], os.environ['PRODUCER_COMMIT'], tag, int(os.environ['PRODUCER_ATTEMPT']))
          PY
      # Only download approved build data; do not check out or execute producer code.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: ${{ runner.temp }}/runtime-producer-dist
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Prepare verified source metadata PR for main
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_TAG: ${{ github.event.workflow_run.head_branch }}
          PRODUCER_COMMIT: ${{ github.event.workflow_run.head_sha }}
          PRODUCER_RUN: ${{ github.event.workflow_run.id }}
          PRODUCER_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          PRODUCER_COMPLETED: ${{ github.event.workflow_run.updated_at }}
        run: |
          gh auth setup-git
          python -m scripts.ci.publish_runtime_manifest \
            --version "${PRODUCER_TAG#v}" \
            --source-commit "$PRODUCER_COMMIT" \
            --release-id "source.$PRODUCER_RUN.$PRODUCER_ATTEMPT" \
            --published-at "$PRODUCER_COMPLETED" \
            --producer-wheel "$RUNNER_TEMP/runtime-producer-dist/openminion-${PRODUCER_TAG#v}-py3-none-any.whl" \
            --workspace "$RUNNER_TEMP/runtime-manifest-publication"

  binary:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.binary_release_tag != '' &&
      inputs.binary_release_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: runtime-publication
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install 'packaging==26.0'
      - name: Verify immutable runtime Release and prepare binary metadata PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          python -m scripts.ci.publish_runtime_manifest \
            --binary-release-tag "${{ inputs.binary_release_tag }}" \
            --binary-release-id "${{ inputs.binary_release_id }}" \
            --workspace "$RUNNER_TEMP/runtime-manifest-publication"

  verify-main:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.binary_release_tag == '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install 'packaging==26.0'
      - name: Verify anonymous main feeds and reachable record commits
        run: python -m scripts.ci.publish_runtime_manifest --verify-main --workspace .
