name: Runtime manifests

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  push:
    branches: [main]
    paths: ['releases/runtime/v1/**']
  workflow_dispatch:
    inputs:
      binary_release_tag:
        description: Immutable openminion/runtime Release tag to publish
        required: false
        type: string
      binary_release_id:
        description: Opaque binary metadata revision identity
        required: false
        type: string
      certify_source_version:
        description: Existing production runtime version to certify for Desktop
        required: false
        type: string
      source_release_id:
        description: Existing null-bound source record identity
        required: false
        type: string
      certification_release_id:
        description: New immutable source certification revision identity
        required: false
        type: string
      desktop_evidence_commit:
        description: Full openminion/desktop main commit containing qualification evidence
        required: false
        type: string
      desktop_evidence_id:
        description: Qualification evidence identity under the fixed Desktop evidence path
        required: false
        type: string

# One writer for both feeds on the same metadata branch. Failed/canceled requests
# are visibly incomplete and require a rerun; this is not a durable queue.
concurrency:
  group: runtime-manifests-publish
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  validate-dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require one complete publication request or an empty verification request
        env:
          BINARY_TAG: ${{ inputs.binary_release_tag }}
          BINARY_ID: ${{ inputs.binary_release_id }}
          SOURCE_VERSION: ${{ inputs.certify_source_version }}
          SOURCE_ID: ${{ inputs.source_release_id }}
          CERTIFICATION_ID: ${{ inputs.certification_release_id }}
          EVIDENCE_COMMIT: ${{ inputs.desktop_evidence_commit }}
          EVIDENCE_ID: ${{ inputs.desktop_evidence_id }}
        run: |
          python - <<'PY'
          import os

          binary = [os.environ["BINARY_TAG"], os.environ["BINARY_ID"]]
          certification = [
              os.environ["SOURCE_VERSION"],
              os.environ["SOURCE_ID"],
              os.environ["CERTIFICATION_ID"],
              os.environ["EVIDENCE_COMMIT"],
              os.environ["EVIDENCE_ID"],
          ]
          if any(binary) and not all(binary):
              raise SystemExit("binary publication inputs must be complete")
          if any(certification) and not all(certification):
              raise SystemExit("source certification inputs must be complete")
          if any(binary) and any(certification):
              raise SystemExit("choose binary publication or source certification")
          PY

  source:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      !contains(github.event.workflow_run.head_branch, 'alpha') &&
      !contains(github.event.workflow_run.head_branch, 'beta') &&
      !contains(github.event.workflow_run.head_branch, 'rc') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: runtime-publication
    permissions:
      contents: write
      actions: read
      pull-requests: write
    steps:
      # Use the trusted default branch implementation, never producer-supplied code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install release metadata dependency
        run: python -m pip install 'packaging==26.0'
      - name: Verify protected publication and successful production job
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN: ${{ github.event.workflow_run.id }}
          PRODUCER_TAG: ${{ github.event.workflow_run.head_branch }}
          PRODUCER_COMMIT: ${{ github.event.workflow_run.head_sha }}
          PRODUCER_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from scripts.ci.publish_runtime_manifest import verify_producer

          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/openminion/openminion/' + path]))

          environment = api('environments/runtime-publication')
          run = api('actions/runs/' + os.environ['PRODUCER_RUN'])
          jobs = api('actions/runs/' + os.environ['PRODUCER_RUN'] + '/jobs?per_page=100')['jobs']
          tag = os.environ['PRODUCER_TAG']
          verify_producer(environment, run, jobs, api('commits/' + tag)['sha'], os.environ['PRODUCER_COMMIT'], tag, int(os.environ['PRODUCER_ATTEMPT']))
          PY
      # Only download approved build data; do not check out or execute producer code.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: ${{ runner.temp }}/runtime-producer-dist
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Prepare verified source metadata PR for main
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_TAG: ${{ github.event.workflow_run.head_branch }}
          PRODUCER_COMMIT: ${{ github.event.workflow_run.head_sha }}
          PRODUCER_RUN: ${{ github.event.workflow_run.id }}
          PRODUCER_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          PRODUCER_COMPLETED: ${{ github.event.workflow_run.updated_at }}
        run: |
          gh auth setup-git
          python -m scripts.ci.publish_runtime_manifest \
            --version "${PRODUCER_TAG#v}" \
            --source-commit "$PRODUCER_COMMIT" \
            --release-id "source.$PRODUCER_RUN.$PRODUCER_ATTEMPT" \
            --published-at "$PRODUCER_COMPLETED" \
            --producer-wheel "$RUNNER_TEMP/runtime-producer-dist/openminion-${PRODUCER_TAG#v}-py3-none-any.whl" \
            --workspace "$RUNNER_TEMP/runtime-manifest-publication"

  binary:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.binary_release_tag != '' &&
      inputs.binary_release_id != ''
    needs: validate-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: runtime-publication
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install 'packaging==26.0'
      - name: Verify immutable runtime Release and prepare binary metadata PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          python -m scripts.ci.publish_runtime_manifest \
            --binary-release-tag "${{ inputs.binary_release_tag }}" \
            --binary-release-id "${{ inputs.binary_release_id }}" \
            --workspace "$RUNNER_TEMP/runtime-manifest-publication"

  source-certification:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.certify_source_version != '' &&
      inputs.source_release_id != '' &&
      inputs.certification_release_id != '' &&
      inputs.desktop_evidence_commit != '' &&
      inputs.desktop_evidence_id != '' &&
      inputs.binary_release_tag == '' &&
      inputs.binary_release_id == ''
    needs: validate-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: runtime-publication
    permissions:
      contents: write
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install 'packaging==26.0'
      - name: Verify exact Desktop qualification and prepare source certification PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          published_at="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          python -m scripts.ci.publish_runtime_manifest \
            --certify-source-version "${{ inputs.certify_source_version }}" \
            --source-release-id "${{ inputs.source_release_id }}" \
            --certification-release-id "${{ inputs.certification_release_id }}" \
            --desktop-evidence-commit "${{ inputs.desktop_evidence_commit }}" \
            --desktop-evidence-id "${{ inputs.desktop_evidence_id }}" \
            --published-at "$published_at" \
            --repository . \
            --workspace "$RUNNER_TEMP/runtime-manifest-publication"

  verify-main:
    if: >-
      always() &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        needs.validate-dispatch.result == 'success' &&
        inputs.binary_release_tag == '' &&
        inputs.certify_source_version == ''))
    needs: validate-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install 'packaging==26.0'
      - name: Verify anonymous main feeds and reachable record commits
        run: python -m scripts.ci.publish_runtime_manifest --verify-main --workspace .
      - name: Report exact public release milestones
        if: success()
        run: >-
          python -m scripts.ci.runtime_release_status
          --repository .
          --latest
          --github-summary "$GITHUB_STEP_SUMMARY"
