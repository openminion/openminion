name: Focus live validation

# Enable a reviewed daily schedule only after default-branch manual acceptance.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focus-live-validation
  cancel-in-progress: false

jobs:
  baseline:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: focus-live-validation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install OpenMinion
        run: python -m pip install -e ".[dev]"
      - name: Prepare isolated evidence roots
        run: |
          mkdir -p "$RUNNER_TEMP/focus-evidence" "$RUNNER_TEMP/focus-home" "$RUNNER_TEMP/focus-data"
          {
            echo "OPENMINION_HOME=$RUNNER_TEMP/focus-home"
            echo "OPENMINION_DATA_ROOT=$RUNNER_TEMP/focus-data"
            echo "OPENMINION_GENERATED_ROOT=$RUNNER_TEMP/focus-data/runtime"
            echo "OPENMINION_CLI_FOCUS_E2E_ARTIFACT_ROOT=$RUNNER_TEMP/focus-private"
            echo "OPENMINION_CLI_FOCUS_E2E_SUMMARY_OUTPUT=$RUNNER_TEMP/focus-evidence/summary.json"
            echo "OPENMINION_CLI_FOCUS_E2E_CONFIG=$GITHUB_WORKSPACE/tests/e2e/fixtures/focus/minimax-baseline.json"
            echo "OPENMINION_CLI_FOCUS_E2E_AGENT=minimax-m2-7"
            echo "OPENMINION_CLI_FOCUS_E2E_RUNNER_TIMEOUT_SECONDS=480"
          } >> "$GITHUB_ENV"
      - name: Run restricted MiniMax Focus baseline
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tests/e2e/runners/run_cli_focus_e2e.py baseline-live
      - name: Retain sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: focus-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/focus-evidence/
          if-no-files-found: error
          retention-days: 14
